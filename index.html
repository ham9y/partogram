<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHO Partogram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#0f766e;--deep:#115e59;--ink:#183236;--muted:#587174;--bg:#f2f7f6;--card:#fff;--line:#cfe0df;--soft:#e7f4f2}
body{min-height:100vh;background:linear-gradient(145deg,#e7f4f2,#f8fbfb 55%,#fff);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}.page-footer{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.86);backdrop-filter:blur(2px);border:1px solid rgba(15,118,110,.12);box-shadow:0 8px 20px rgba(15,118,110,.08);padding:7px 22px;border-radius:999px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px;white-space:nowrap;z-index:20}
header{background:linear-gradient(135deg,#0b5e57,#0f766e);color:#fff;padding:17px 22px;box-shadow:0 3px 18px rgba(22,70,70,.18)}
header h1{font-size:21px;font-weight:700;line-height:1.2}
header p{font-size:12px;opacity:.88;margin-top:2px}
.author{font-size:12px;opacity:.9;margin-top:0;font-weight:600;line-height:1.2}
main{width:min(760px,100%);margin:auto;padding:12px 18px 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;box-shadow:0 8px 30px rgba(22,70,70,.08);text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-size:30px;font-weight:800}.card h2{font-size:25px;color:var(--deep);margin-bottom:8px}.card>p{color:var(--muted);font-size:14px;max-width:560px;margin:0 auto 25px}.text{font-size:1.02rem;line-height:2;color:var(--ink);margin:0 auto 28px;max-width:620px}.btn{display:inline-block;width:100%;max-width:220px;padding:13px 16px;background:var(--p);color:#fff;text-decoration:none;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(15,118,110,.22)}.btn:hover{transform:translateY(-2px)}.note{margin-top:20px;color:var(--muted);font-size:11px}@media(max-width:560px){.card{padding:24px 17px}.card h2{font-size:21px}.text{font-size:1rem;line-height:1.9}}
</style>
</head>
<body>
<header>
<h1>WHO Partogram</h1>
<div class="author">By Dr. Hamdy</div>
</header>
<main>
<section class="card">
<div class="mark" aria-hidden="true">🤰</div>
<h2>Partogram</h2>
<p>By Dr. Hamdy</p>
<div class="text">
لم يكن من السهل تعليم البرنامج رسم وملء البارتوجرام مثل الإنسان<br>
واستغرق الأمر مجهود كبير وساعات عمل طويلة<br>
وكثير من الإخفاقات في الطريق<br>
والآن نقدمه لكم بشكل تطوعي بدون مقابل<br>
فقط كلمة طيبة أو دعوة صادقة تكفينا
</div>
<a class="btn" href="1.html">حسنا</a>
<p class="note"></p>
</section>
</main>
<div class="page-footer">وفقنا الله وإياكم</div>
</body>
</html>
